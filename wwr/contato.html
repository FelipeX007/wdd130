<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fale Conosco | Companhia de Rafting em Corredeiras</title>

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.png" alt="Logo da Companhia de Rafting" class="logo">

        <nav>
            <a href="index.html">Página Inicial</a>
            <a href="sobre.html">Sobre Nós</a>
            <a href="passeios.html">Passeios</a>
            <a href="contato.html">Fale Conosco</a>
        </nav>
    </header>

    <main>
        <section class="company-info">
            <h1>Companhia de Rafting em Corredeiras</h1>
            <p class="address">123 Rua Principal do Rio<br>Foz do Iguaçu, Paraná</p>
            <p class="phone">+55 45 99999-9999</p>
            <p class="email"><a href="mailto:info@correiras.com">info@correiras.com</a></p>
        </section>

        <div class="contact-grid">
            <div class="map-container">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3600.000000000000!2d-54.58!3d-25.54!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMjXCsDMyJzAwLjAiUyA1NMKwMzQnMDAuMCJX!5e0!3m2!1spt-BR!2sbr!4v1234567890123"
                  width="100%" height="350" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>

            <form action="#" method="post" class="contact-form">
                <div class="form-group">
                    <label for="fullname">Nome:</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Digite aqui"
                      required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="Digite aqui" required>
                </div>

                <fieldset class="form-group radio-group">
                    <legend>Propósito da Mensagem:</legend>

                    <label>
                        <input type="radio" name="purpose" value="geral" checked>
                        Consulta Geral
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="reserva">
                        Pergunta sobre Reserva
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="sugestao">
                        Sugestão de Site
                    </label>
                </fieldset>

                <div class="form-group">
                    <label for="message">Mensagem:</label>
                    <textarea id="message" name="message" rows="5" placeholder="Digite aqui"
                      required></textarea>
                </div>

                <div class="form-group checkbox-group">
                    <label for="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter" value="yes">
                        Quero receber a newsletter mensal
                    </label>
                </div>

                <button type="submit" class="submit-btn">Entrar em Contato!</button>
            </form>
        </div>

        <section class="team-section">
            <h2>Estamos Aqui para Serví-lo</h2>

            <div class="team-grid">
                <figure class="team-member">
                    <img src="images/funcionario1.jpg" alt="Foto de Carlos Silva, Guia Principal">
                    <figcaption>
                        <h3>Carlos Silva</h3>
                        <p>Guia Principal</p>
                    </figcaption>
                </figure>

                <figure class="team-member">
                    <img src="images/funcionario2.jpg"
                      alt="Foto de Ana Souza, Gerente de Operações">
                    <figcaption>
                        <h3>Ana Souza</h3>
                        <p>Gerente de Operações</p>
                    </figcaption>
                </figure>

                <figure class="team-member">
                    <img src="images/funcionario3.jpg"
                      alt="Foto de Mariana Oliveira, Instrutora de Segurança">
                    <figcaption>
                        <h3>Mariana Oliveira</h3>
                        <p>Instrutora de Segurança</p>
                    </figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>Conteúdo de Rodapé incluindo Ícones/Links de Mídia Social</p>
        <div class="social-links">
            <a href="https://facebook.com" target="_blank"><img src="images/facebook.png"
                  alt="Facebook"></a>
            <a href="https://twitter.com" target="_blank"><img src="images/twitter.png"
                  alt="Twitter"></a>
            <a href="https://instagram.com" target="_blank"><img src="images/instagram.png"
                  alt="Instagram"></a>
        </div>
    </footer>

</body>

</html>
