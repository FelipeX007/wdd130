<!DOCTYPE html>
<html lang="pt-BR">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionário de HTML e CSS</title>
    <link rel="stylesheet" href="estilos/questionario.css">
</head>


<body>

    <div class="container">
        <h1>WDD 130: Questionário de HTML e CSS</h1>

        <form action="#" method="post">


            <div class="form-group">
                <label for="q1">1. Qual elemento HTML é utilizado para criar um hiperlink em uma
                    página web?</label>
                <input type="text" id="q1" name="q1" required>
            </div>


            <div class="form-group">
                <label for="q2">2. Descreva brevemente a principal responsabilidade do HTML em
                    comparação com o CSS no desenvolvimento web:</label>
                <textarea id="q2" name="q2" required></textarea>
            </div>


            <div class="form-group">
                <label for="q3">3. Qual propriedade CSS altera a cor do texto de um
                    elemento?</label>
                <select id="q3" name="q3" required>
                    <option value="" selected disabled>Escolha uma...</option>
                    <option value="background-color">background-color</option>
                    <option value="color">color</option>
                    <option value="font-style">font-style</option>
                    <option value="text-align">text-align</option>
                </select>
            </div>


            <div class="form-group">
                <label for="q4">4. Quantos níveis de títulos numéricos principais (de h1 até hN)
                    existem nativamente no HTML?</label>
                <input type="number" id="q4" name="q4" min="1" max="10" required>
            </div>


            <button type="submit">Enviar Questionário</button>

        </form>
    </div>

</body>

</html>
